<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three.js Interactive Wireframe</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      height: 100%;
      width: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r83/three.min.js"></script>
  <script>
    // Setup
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("canvas"), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0xffffff, 1); // White background

    // Geometry and Material
    var geometry = new THREE.IcosahedronGeometry(1.5, 1);
    var hue = 0;
    var material = new THREE.MeshBasicMaterial({
      color: new THREE.Color(`hsl(${hue}, 100%, 50%)`),
      wireframe: true
    });
    var wireframe = new THREE.Mesh(geometry, material);
    scene.add(wireframe);

    // Raycaster and mouse tracking
    var raycaster = new THREE.Raycaster();
    var mouse = new THREE.Vector2();
    var isHovered = false;

    window.addEventListener('mousemove', function (event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    }, false);

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      // Check for mouse over
      raycaster.setFromCamera(mouse, camera);
      var intersects = raycaster.intersectObject(wireframe);

      let rotationSpeed, hueSpeed;

      if (intersects.length > 0) {
        if (!isHovered) {
          wireframe.scale.set(1.2, 1.2, 1.2);
          isHovered = true;
        }
        rotationSpeed = 0.01;
        hueSpeed = 5;
      } else {
        if (isHovered) {
          wireframe.scale.set(1, 1, 1);
          isHovered = false;
        }
        rotationSpeed = 0.001;
        hueSpeed = 1;
      }

      // Animate rotation and colour
      wireframe.rotation.x += rotationSpeed;
      wireframe.rotation.y += rotationSpeed;
      hue = (hue + hueSpeed) % 360;
      material.color.setHSL(hue / 360, 1, 0.5);

      renderer.render(scene, camera);
    }

    animate();

    // Handle window resizing
    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</
