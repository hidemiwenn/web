<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three.js Interactive Wireframe</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      height: 100%;
      width: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r83/three.min.js"></script>
  <script>
    // Setup
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("canvas"), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0xffffff, 1); // White background

    // Geometry
    var geometry = new THREE.IcosahedronGeometry(1.5, 1);

    // Create visible rainbow wireframe material
    var wireMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color(`hsl(0, 100%, 50%)`),
      wireframe: true
    });

    // Create invisible solid material for raycasting
    var hitboxMaterial = new THREE.MeshBasicMaterial({
      transparent: true,
      opacity: 0 // fully invisible
    });

    // Combine both using THREE.Group
    var wireframe = new THREE.Mesh(geometry, wireMaterial);
    var hitbox = new THREE.Mesh(geometry, hitboxMaterial);

    var group = new THREE.Group();
    group.add(hitbox); // for raycasting
    group.add(wireframe); // for visible mesh
    scene.add(group);
