<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three.js Interactive Wireframe</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      height: 100%;
      width: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r83/three.min.js"></script>
  <script>
    // Setup
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5; // Ensure camera is positioned to view the object

    var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("canvas"), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0xffffff, 1); // White background

    // Geometry (make sure the object is large enough)
    var geometry = new THREE.IcosahedronGeometry(1.5, 1);

    // Create visible rainbow wireframe material
    var wireMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color(`hsl(0, 100%, 50%)`),
      wireframe: true
    });

    // Create invisible solid material for raycasting
    var hitboxMaterial = new THREE.MeshBasicMaterial({
      transparent: true,
      opacity: 0 // fully invisible
    });

    // Combine both using THREE.Group
    var wireframe = new THREE.Mesh(geometry, wireMaterial);
    var hitbox = new THREE.Mesh(geometry, hitboxMaterial);

    var group = new THREE.Group();
    group.add(hitbox); // for raycasting
    group.add(wireframe); // for visible mesh
    scene.add(group);

    // Raycaster and mouse tracking
    var raycaster = new THREE.Raycaster();
    var mouse = new THREE.Vector2();

    window.addEventListener('mousemove', function (event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    }, false);

    // Variables for rainbow colour
    var hue = 0;

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      // Check for mouse over
      raycaster.setFromCamera(mouse, camera);
      var intersects = raycaster.intersectObject(hitbox);

      let rotationSpeed;

      if (intersects.length > 0) {
        rotationSpeed = 0.001; // Rotate faster when hovered
      } else {
        rotationSpeed = 0.004; // Normal rotation speed
      }

      // Rotate the group
      group.rotation.x += rotationSpeed;
      group.rotation.y += rotationSpeed;

      // Continuously change the hue for rainbow effect
      hue = (hue + 1) % 360; // Hue cycles from 0 to 360
      wireMaterial.color.setHSL(hue / 360, 1, 0.5); // Apply the rainbow colour

      // Render scene
      renderer.render(scene, camera);
    }

    animate();

    // Handle window resizing
    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
