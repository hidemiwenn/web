<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #fff;
    height: 100%;
    width: 100%;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>

<canvas id="canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r83/three.min.js"></script>
<script>
  // Setup
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 5;

  var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("canvas"), antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0xffffff, 1); // white background

  // Geometry
  var geometry = new THREE.IcosahedronGeometry(1.5, 1);
  var hue = 0;
  var material = new THREE.MeshBasicMaterial({ color: new THREE.Color(`hsl(${hue}, 100%, 50%)`), wireframe: true });
  var wireframe = new THREE.Mesh(geometry, material);
  scene.add(wireframe);

  // Animation loop
  function animate() {
    requestAnimationFrame(animate);
    wireframe.rotation.x += 0.001;
    wireframe.rotation.y += 0.001;
    renderer.render(scene, camera);
    hue = (hue + 1) % 360;
    material.color.setHSL(hue / 360, 1, 0.5);
  }

  animate();

  // Resize
  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
